name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --locked --no-install-project
      - run: uv build
      - run: uv run --no-sync python -m twine check --strict dist/*
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          cp -R tests "$RUNNER_TEMP/workflow-sim-tests"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "import workflow_sim; assert '/site-packages/' in workflow_sim.__file__, workflow_sim.__file__"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q workflow-sim-tests --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - name: Minimal dependency consumer
        run: uv run --no-sync python scripts/check_package.py
      - name: Workflow examples and broken controls
        run: uv run --no-sync python scripts/check_examples.py --output example-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: alpha-${{ matrix.os }}
          path: |
            dist/*
            test-results.xml
            example-evidence/
          if-no-files-found: error
          retention-days: 30
  confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CONTRACT_BROKER: redis://localhost:6379/0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.6'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --locked --no-install-project
      - run: uv build
      - run: uv pip install --python .venv/bin/python --no-deps dist/*.whl
      - name: Real prefork worker and Redis differential checks
        run: uv run --no-sync python scripts/check_celery_contracts.py --output confidence-evidence/celery
      - name: Targeted simulator mutation campaign
        run: uv run --no-sync python scripts/check_mutations.py --output confidence-evidence/mutations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: alpha-confidence
          path: confidence-evidence/
          if-no-files-found: error
          retention-days: 30
