name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cp -R tests "$RUNNER_TEMP/workflow-sim-tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q workflow-sim-tests --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - name: Minimal dependency consumer
        run: python scripts/check_package.py
      - name: Six domain examples and broken controls
        run: python scripts/check_examples.py --output example-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: alpha-${{ matrix.os }}
          path: |
            dist/*
            test-results.xml
            example-evidence/
          if-no-files-found: error
          retention-days: 30
  confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CONTRACT_BROKER: redis://localhost:6379/0
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - name: Real prefork worker and Redis differential checks
        run: python scripts/check_celery_contracts.py --output confidence-evidence/celery
      - name: Targeted simulator mutation campaign
        run: python scripts/check_mutations.py --output confidence-evidence/mutations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: alpha-confidence
          path: confidence-evidence/
          if-no-files-found: error
          retention-days: 30
