name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel outside source tree
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cp -R tests "$RUNNER_TEMP/workflow-sim-tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q workflow-sim-tests --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - name: Minimal dependency consumer
        run: python scripts/check_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: alpha-${{ matrix.os }}
          path: |
            dist/*
            test-results.xml
          if-no-files-found: error
          retention-days: 30
