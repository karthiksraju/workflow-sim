name: Draft alpha release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact alpha tag, for example v0.1.0a1
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.6'
      - run: uv python install
      - name: Verify tag, metadata and successful platform CI
        id: verified
        run: uv run --no-project --python 3.12 python scripts/check_release.py
      - name: Promote the exact distribution tested by CI
        env:
          CI_RUN_ID: ${{ steps.verified.outputs.ci_run_id }}
        run: |
          gh run download "$CI_RUN_ID" --name alpha-ubuntu-latest --dir promoted
          mkdir dist
          cp promoted/dist/*.whl promoted/dist/*.tar.gz dist/
          cp promoted/test-results.xml dist/test-results-linux.xml
          gh run download "$CI_RUN_ID" --name alpha-macos-latest --dir promoted-macos
          cp promoted-macos/test-results.xml dist/test-results-macos.xml
          gh run download "$CI_RUN_ID" --name alpha-confidence --dir confidence-evidence
          tar -czf dist/confidence-evidence.tar.gz confidence-evidence
          tar -czf dist/example-evidence.tar.gz -C promoted example-evidence
      - name: Record artifact hashes
        working-directory: dist
        run: sha256sum *.whl *.tar.gz *.xml > SHA256SUMS
      - name: Create draft for owner review
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "workflow-sim $RELEASE_TAG — internal alpha" --notes-file docs/alpha-release.md
