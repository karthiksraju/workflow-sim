name: Draft alpha release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact alpha tag, for example v0.1.0a1
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag, metadata and successful platform CI
        id: verified
        run: python scripts/check_release.py
      - name: Promote the exact distribution tested by CI
        env:
          CI_RUN_ID: ${{ steps.verified.outputs.ci_run_id }}
        run: |
          gh run download "$CI_RUN_ID" --name alpha-ubuntu-latest --dir promoted
          mkdir dist
          cp promoted/dist/*.whl promoted/dist/*.tar.gz dist/
          cp promoted/test-results.xml dist/test-results-linux.xml
          gh run download "$CI_RUN_ID" --name alpha-macos-latest --dir promoted-macos
          cp promoted-macos/test-results.xml dist/test-results-macos.xml
      - name: Record artifact hashes
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create draft for owner review
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "workflow-sim $RELEASE_TAG — internal alpha" --notes-file docs/alpha-release.md
