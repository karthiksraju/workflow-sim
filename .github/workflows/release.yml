name: Draft alpha release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact alpha tag, for example v0.1.0a1
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag, metadata and successful platform CI
        run: python scripts/check_release.py
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pytest -q
      - run: python scripts/check_package.py
      - name: Record artifact hashes
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create draft for owner review
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease --title "workflow-sim $RELEASE_TAG — internal alpha" --notes-file docs/alpha-release.md
