[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-sim"
version = "0.1.0a5"
description = "Deterministic, process-isolated tests for asynchronous Python workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{name = "Karthik Raju"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX",
]
dependencies = ["celery>=5.6.3,<5.7", "time-machine>=3.5.1,<4"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "hypothesis>=6.168,<7", "build>=1.2,<2", "twine>=6,<8", "redis>=5,<9"]

[project.scripts]
workflow-sim = "workflow_sim.cli:main"

[project.urls]
Source = "https://github.com/karthiksraju/workflow-sim"
Issues = "https://github.com/karthiksraju/workflow-sim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflow_sim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

